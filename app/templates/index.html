<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gracia — Akıllı Satış Asistanı</title>
<style>
  :root {
    --gracia-pink: #e8a0a8;
    --gracia-dark: #2b2b2b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: linear-gradient(135deg, #f7f2f0 0%, #ecdcdf 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 16px;
  }
  header {
    width: 100%;
    max-width: 900px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 32px;
  }
  .logo {
    font-size: 28px;
    font-weight: 700;
    color: var(--gracia-dark);
    letter-spacing: 1px;
  }
  .slogan {
    font-size: 13px;
    color: #8a7a7c;
  }
  main {
    width: 100%;
    max-width: 900px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
  }
  @media (max-width: 720px) {
    main { grid-template-columns: 1fr; }
  }
  .card {
    background: rgba(255, 255, 255, 0.55);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(255, 255, 255, 0.6);
    border-radius: 20px;
    padding: 24px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
  }
  .card h2 {
    font-size: 18px;
    color: var(--gracia-dark);
    margin-bottom: 16px;
  }
  #sohbet-alani {
    height: 320px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 14px;
    padding-right: 4px;
  }
  .mesaj-balon {
    max-width: 85%;
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 14px;
    line-height: 1.4;
  }
  .kullanici {
    align-self: flex-end;
    background: var(--gracia-pink);
    color: #fff;
    border-bottom-right-radius: 4px;
  }
  .asistan {
    align-self: flex-start;
    background: #fff;
    color: var(--gracia-dark);
    border-bottom-left-radius: 4px;
  }
  .giris-satiri {
    display: flex;
    gap: 8px;
  }
  input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #ddd;
    border-radius: 10px;
    font-size: 14px;
    outline: none;
  }
  input:focus { border-color: var(--gracia-pink); }
  button {
    padding: 10px 18px;
    border: none;
    border-radius: 10px;
    background: var(--gracia-dark);
    color: #fff;
    font-size: 14px;
    cursor: pointer;
    white-space: nowrap;
  }
  button:hover { background: #444; }
  button:disabled { opacity: 0.6; cursor: default; }
  .form-alan { margin-bottom: 12px; }
  .form-alan label {
    display: block;
    font-size: 12px;
    color: #8a7a7c;
    margin-bottom: 4px;
  }
  #kayit-durum {
    margin-top: 10px;
    font-size: 13px;
  }
  #kayit-durum.basarili { color: #2e7d32; }
  #kayit-durum.hatali { color: #c62828; }
</style>
</head>
<body>

<header>
  <div class="logo">GRACIA</div>
  <div class="slogan">Her bedene, kendi kalıbında konfor</div>
</header>

<main>
  <section class="card">
    <h2>Bize soru sor</h2>
    <div id="sohbet-alani"></div>
    <div class="giris-satiri">
      <input type="text" id="mesaj-input" placeholder="Bir mesaj yaz..." />
      <button id="gonder-btn">Sor</button>
    </div>
  </section>

  <section class="card">
    <h2>İletişim bilgini bırak</h2>
    <div class="form-alan">
      <label for="isim-input">İsim</label>
      <input type="text" id="isim-input" placeholder="Adın" />
    </div>
    <div class="form-alan">
      <label for="telefon-input">Telefon</label>
      <input type="text" id="telefon-input" placeholder="05xx xxx xx xx" />
    </div>
    <button id="kaydet-btn">Kaydet</button>
    <div id="kayit-durum"></div>
  </section>
</main>

<script>
  const sohbetAlani = document.getElementById('sohbet-alani');
  const mesajInput = document.getElementById('mesaj-input');
  const gonderBtn = document.getElementById('gonder-btn');

  const isimInput = document.getElementById('isim-input');
  const telefonInput = document.getElementById('telefon-input');
  const kaydetBtn = document.getElementById('kaydet-btn');
  const kayitDurum = document.getElementById('kayit-durum');

  let gecmis = [];
  let sonMesaj = '';

  function balonEkle(metin, kim) {
    const div = document.createElement('div');
    div.className = 'mesaj-balon ' + kim;
    div.textContent = metin;
    sohbetAlani.appendChild(div);
    sohbetAlani.scrollTop = sohbetAlani.scrollHeight;
  }

  async function mesajGonder() {
    const mesaj = mesajInput.value.trim();
    if (!mesaj) return;

    sonMesaj = mesaj;
    balonEkle(mesaj, 'kullanici');
    mesajInput.value = '';
    gonderBtn.disabled = true;

    try {
      const yanit = await fetch('/api/sohbet', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ mesaj: mesaj, gecmis: gecmis })
      });
      const veri = await yanit.json();

      if (veri.basari) {
        balonEkle(veri.yanit, 'asistan');
        gecmis.push({ role: 'user', content: mesaj });
        gecmis.push({ role: 'assistant', content: veri.yanit });
      } else {
        balonEkle('Üzgünüm, bir sorun oluştu: ' + (veri.hata || ''), 'asistan');
      }
    } catch (hata) {
      balonEkle('Bağlantı sorunu oluştu, lütfen tekrar dene.', 'asistan');
    } finally {
      gonderBtn.disabled = false;
    }
  }

  gonderBtn.addEventListener('click', mesajGonder);
  mesajInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') mesajGonder();
  });

  async function leadKaydet() {
    const isim = isimInput.value.trim();
    const telefon = telefonInput.value.trim();

    if (!isim || !telefon) {
      kayitDurum.textContent = 'Lütfen isim ve telefon gir.';
      kayitDurum.className = 'hatali';
      return;
    }

    kaydetBtn.disabled = true;
    try {
      const yanit = await fetch('/api/leads', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ isim: isim, telefon: telefon, mesaj: sonMesaj })
      });
      const veri = await yanit.json();

      if (veri.basari) {
        kayitDurum.textContent = 'Teşekkürler! En kısa sürede dönüş yapacağız.';
        kayitDurum.className = 'basarili';
        isimInput.value = '';
        telefonInput.value = '';
      } else {
        kayitDurum.textContent = veri.hata || 'Kayıt yapılamadı.';
        kayitDurum.className = 'hatali';
      }
    } catch (hata) {
      kayitDurum.textContent = 'Bağlantı sorunu oluştu.';
      kayitDurum.className = 'hatali';
    } finally {
      kaydetBtn.disabled = false;
    }
  }

  kaydetBtn.addEventListener('click', leadKaydet);
</script>

</body>
</html>
